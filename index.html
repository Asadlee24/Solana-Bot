<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solana Copy Engine | Low-Latency Mirror Trading Console</title>
    <script>
      // Fallback redirection if root is served directly
      (function() {
        var target = '/dashboard/dist/index.html';
        if (window.location.pathname.indexOf('/assets/') === -1) {
          window.location.replace(target);
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        background: #090b10;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader-card {
        background: #111520;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 32px;
        text-align: center;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(41, 212, 255, 0.2);
        border-top-color: #29d4ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: #29d4ff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="loader-card">
      <div class="spinner"></div>
      <h3 style="margin: 0 0 8px 0; font-size: 16px; font-weight: 600;">Connecting Solana Copy Terminal</h3>
      <p style="margin: 0 0 16px 0; font-size: 13px; color: #94a3b8;">Loading low-latency trading dashboard interface...</p>
      <a href="/dashboard/dist/index.html" style="font-size: 12px;">Click here if not redirected automatically</a>
    </div>
  </body>
</html>
