name: 24/7 Autonomous Solana Copy Bot & Telegram Terminal

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: solana-bot-singleton
  cancel-in-progress: true

jobs:
  run-bot:
    name: ⚡ 24/7 Solana Copy Bot & Telegram Terminal
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run 24/7 Solana Copy Bot & Telegram Alert Worker
        env:
          NODE_ENV: production
          EXECUTION_MODE: PAPER
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          WATCHED_WALLETS: ${{ secrets.WATCHED_WALLETS || 'CwUHN4zTn5wiEYoZjsP4FrDvAT9heDWewCTQjhgwhJqS' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIXED_BUY_SOL: "0.1"
          DEFAULT_SIZING_MODE: FIXED_SIZE
        run: |
          echo "============================================================"
          echo "🚀 STARTING 24/7 SOLANA COPY BOT & TELEGRAM TERMINAL"
          echo "Network: High-Speed Azure Cloud Datacenter (US)"
          echo "============================================================"
          timeout 3000s npx tsx src/index.ts || true
